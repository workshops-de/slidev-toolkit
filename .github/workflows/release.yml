# Publishes the package to npm when a version tag (v1.2.3) is pushed and moves the major tag
# (v1) that slide repositories reference for the reusable deploy workflow.
#
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. On npmjs.com the package
# @workshops.de/slidev-toolkit needs a trusted publisher with organization "workshops-de",
# repository "slidev-toolkit" and workflow "release.yml". Provenance is added automatically.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Publish to npm
        run: npm publish --access public

      - name: Move major version tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
